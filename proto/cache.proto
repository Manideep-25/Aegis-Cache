// Enums are named constant and are used to define a fixed set of constant values in a clean and type-safe way.

// The message keyword was used to define structured data models for requests, responses, cache entries, statistics, and events exchanged between the gRPC client and server. These messages act as DTOs (Data Transfer Objects) and provide a strict schema for network communication.

// The service block was used to define the gRPC API contract for the cache system. Inside it, rpc methods define the remote operations clients can invoke, such as getting cache values, setting data, deleting keys, changing eviction policy, and monitoring live events.

// Primitive protobuf types like string, bytes, bool, int32, int64, and double were used to store different forms of data such as keys, binary cache values flags, timestamps, counters, capacities, and latency metrics. These types provide compact and platform-independent serialization.

syntax = "proto3";

package aegiscache;

enum EvictionPolicy {
  LRU  = 0;
  LFU  = 1;
  FIFO = 2;
}

enum CacheTier {
  L1_MEMORY  = 0;
  L2_REDIS   = 1;
  DB_BACKEND = 2;
}

enum EventType {
  HIT           = 0;
  MISS          = 1;
  EVICTION      = 2;
  POLICY_CHANGE = 3;
  ERROR         = 4;
}

message Empty {}

message CacheEntry {
  string key         = 1;
  bytes  value       = 2;
  int64  ttl_seconds = 3;
}

message RequestMeta {
  string request_id   = 1;
  int64  timestamp_ms = 2;
  double latency_ms   = 3;
}

message KeyRequest {
  string      key  = 1;
  RequestMeta meta = 2;
}

message ValueResponse {
  string      key         = 1;
  bytes       value       = 2;
  bool        found       = 3;
  CacheTier   source_tier = 4;
  RequestMeta meta        = 5;
}

message SetRequest {
  CacheEntry  entry         = 1;
  bool        write_through = 2;
  RequestMeta meta          = 3;
}

message SetResponse {
  bool        success = 1;
  string      message = 2;
  RequestMeta meta    = 3;
}

message DeleteRequest {
  string      key  = 1;
  RequestMeta meta = 2;
}

message DeleteResponse {
  bool        deleted = 1;
  RequestMeta meta    = 2;
}

message PolicyRequest {
  EvictionPolicy policy   = 1;
  int32          capacity = 2;
  RequestMeta    meta     = 3;
}

message ToggleResponse {
  bool           success          = 1;
  EvictionPolicy active_policy    = 2;
  int32          current_capacity = 3;
  string         message          = 4;
  RequestMeta    meta             = 5;
}

message CacheStats {
  int64          total_requests  = 1;
  int64          l1_hits         = 2;
  int64          l2_hits         = 3;
  int64          db_hits         = 4;
  int64          total_evictions = 5;
  double         hit_rate        = 6;
  double         avg_latency_ms  = 7;
  int32          l1_size         = 8;
  int32          l1_capacity     = 9;
  EvictionPolicy active_policy   = 10;
  RequestMeta    meta            = 11;
}

message MonitorRequest {
  repeated EventType filter_types = 1;
  string             client_id    = 2;
}

message CacheEvent {
  EventType      event_type   = 1;
  string         key          = 2;
  CacheTier      tier         = 3;
  double         latency_ms   = 4;
  EvictionPolicy policy       = 5;
  string         detail       = 6;
  int64          timestamp_ms = 7;
  CacheStats     stats        = 8;
}

service AegisCache {
  rpc GetValue      (KeyRequest)     returns (ValueResponse);
  rpc SetValue      (SetRequest)     returns (SetResponse);
  rpc DeleteValue   (DeleteRequest)  returns (DeleteResponse);
  rpc SetPolicy     (PolicyRequest)  returns (ToggleResponse);
  rpc GetStats      (Empty)          returns (CacheStats);
  rpc MonitorEvents (MonitorRequest) returns (stream CacheEvent);
}